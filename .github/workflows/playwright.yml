name: Run Scripts Daily

on:
  schedule:
    - cron: '0 0 * * *'     # 5:30 AM IST
    - cron: '30 7 * * *'    # 1:00 PM IST
    - cron: '30 11 * * *'   # 5:00 PM IST
    - cron: '30 16 * * *'   # 10:00 PM IST
  workflow_dispatch:

concurrency:
  group: daily-scripts
  cancel-in-progress: false

jobs:
  run-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          echo "Repo contents:"
          ls -la
          if [ ! -f requirements.txt ]; then
            echo "::error::requirements.txt not found at repo root"
            exit 1
          fi
          if [ ! -d scripts ]; then
            echo "::error::scripts/ folder not found at repo root"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run all scripts one by one and collect errors
        env:
          LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL }}
          LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
        run: |
          shopt -s nullglob
          mkdir -p logs
          failed=0
          files=(scripts/*.py)

          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::No .py files found in scripts/"
            echo "No scripts found" > logs/no-scripts.txt
            exit 0
          fi

          echo "## Script results" >> "$GITHUB_STEP_SUMMARY"

          for file in "${files[@]}"; do
            name=$(basename "$file")
            echo "::group::Running $name"
            if python "$file" > "logs/$name.log" 2>&1; then
              echo "✅ $name" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$name FAILED" >> logs/failures.txt
              echo "❌ $name" >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
            cat "logs/$name.log"
            echo "::endgroup::"
          done

          if [ $failed -eq 1 ]; then
            echo "::error::Some scripts failed. See logs/failures.txt"
            cat logs/failures.txt
            exit 1
          fi

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: script-logs-${{ github.run_id }}
          path: logs/
          retention-days: 14
          if-no-files-found: ignore